<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1138" width="1100" height="1138" role="img" aria-labelledby="title description">
<title id="title">校圈 Campus Circle 用例图</title>
<desc id="description">外框表示校圈系统边界，按 A 至 D 模块布置 17 个用例。左侧为主要参与者，右侧为配合角色和候选外部推送服务。每个用例带唯一编号。</desc>
<style>
text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill:#172d45; }
.actor,.role,.case { text-anchor:middle; }
.actor { font-weight:700; font-size:16px; }
.role { font-size:12px; fill:#3e5972; }
.case { font-weight:600; font-size:16px; dominant-baseline:middle; }
</style>
<rect width="1100" height="1138" fill="#ffffff"/>
<text x="24" y="39" font-size="27" font-weight="700">校圈 Campus Circle 用例图</text>
<text x="24" y="64" font-size="14" fill="#3e5972">软件需求 v1.0　·　实线表示参与，虚线表示候选外部依赖</text>
<text x="30" y="101" font-size="15" font-weight="700">主要参与者</text>
<text x="912" y="101" font-size="15" font-weight="700">配合角色与外部系统</text>
